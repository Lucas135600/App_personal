<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — LB Personal Trainner</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #08090a;
        color: #e8eaee;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        border: 1px solid #17191d;
        background: #0d0f11;
        border-radius: 18px;
        padding: 32px 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #c8f542;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg {
        width: 32px;
        height: 31px;
      }
      h1 { font-size: 1.125rem; margin: 0 0 8px; }
      p { font-size: 0.875rem; line-height: 1.5; color: #9aa1ac; margin: 0 0 20px; }
      button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: #c8f542;
        color: #08090a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      small { display: block; margin-top: 16px; font-size: 0.6875rem; color: #6c727c; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg viewBox="33 27 94 91" aria-hidden="true">
          <g fill="none" stroke="#08090a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 70 L70 52 L88 64 L120 34" />
            <path d="M120 34 L120 52 M120 34 L102 34" />
          </g>
          <g fill="#08090a">
            <rect x="58" y="96" width="44" height="11" rx="5" />
            <rect x="46" y="86" width="12" height="31" rx="5" />
            <rect x="102" y="86" width="12" height="31" rx="5" />
            <rect x="34" y="93" width="9" height="17" rx="4" />
            <rect x="117" y="93" width="9" height="17" rx="4" />
          </g>
        </svg>
      </div>
      <h1>Você está sem conexão</h1>
      <p>
        Seu treino e sua evolução ficam no servidor, então o app precisa de internet para abrir.
        Assim que a conexão voltar, é só tentar de novo.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>LB Personal Trainner</small>
    </div>
  </body>
</html>
